name: Fetch and process data
description: Download a source file and run a Deno processor against it.
inputs:
  url:
    description: Source URL to download.
    required: true
  output:
    description: Path where the raw downloaded file should be written.
    required: true
  processor:
    description: Deno processor script to run after download.
    required: true
runs:
  using: composite
  steps:
    - name: Download source
      shell: bash
      env:
        SOURCE_URL: ${{ inputs.url }}
        OUTPUT_PATH: ${{ inputs.output }}
      run: |
        mkdir -p "$(dirname "$OUTPUT_PATH")"
        curl --fail --location --silent --show-error --retry 3 \
          --max-time 120 --output "$OUTPUT_PATH" "$SOURCE_URL"
    - name: Process source
      shell: bash
      env:
        PROCESSOR_PATH: ${{ inputs.processor }}
        OUTPUT_PATH: ${{ inputs.output }}
      run: deno run --frozen --allow-read --allow-write "$PROCESSOR_PATH" "$OUTPUT_PATH"
